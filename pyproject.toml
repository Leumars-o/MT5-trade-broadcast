[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copier-bot"
version = "0.1.0"
description = "Read-only MT5 position observer that pushes trade alerts to Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    # metaapi-cloud-sdk is only needed for the live feed (M4); kept out of the
    # default install so the test suite has zero broker dependencies.
]

[project.optional-dependencies]
live = ["metaapi-cloud-sdk>=27.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
copier = "copier.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/copier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["copier"]

# Third-party libs without bundled type stubs. Installing pandas-stubs /
# types-PyYAML is optional; ignoring keeps `mypy src` clean without them.
[[tool.mypy.overrides]]
module = ["yaml", "pandas", "pandas.*"]
ignore_missing_imports = true
